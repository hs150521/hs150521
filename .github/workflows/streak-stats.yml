name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate light streak stats
        uses: DenverCoder1/github-readme-streak-stats@f69662e10794e8757b12d3303a113a30b01c9bc9
        with:
          options: user=${{ github.repository_owner }}&background=00000000&hide_border=true&disable_animations=true&timezone=Asia/Tokyo&sideNums=1F2328&currStreakNum=1F2328&sideLabels=1F2328&dates=57606A&stroke=D1D9E0&ring=D97706&fire=D97706&currStreakLabel=D97706
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark streak stats
        uses: DenverCoder1/github-readme-streak-stats@f69662e10794e8757b12d3303a113a30b01c9bc9
        with:
          options: user=${{ github.repository_owner }}&background=00000000&hide_border=true&disable_animations=true&timezone=Asia/Tokyo&sideNums=F0F6FC&currStreakNum=F0F6FC&sideLabels=F0F6FC&dates=9198A1&stroke=3D444D&ring=FFA657&fire=FFA657&currStreakLabel=FFA657
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/streak-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update streak stats"
          git push
